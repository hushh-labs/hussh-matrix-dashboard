name: Responsive dashboard UI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'server.ts'
      - 'package*.json'
      - 'playwright.config.ts'
      - 'vite.config.ts'
      - 'index.html'
      - 'infra/one-plg/**'
      - 'scripts/plg-worker.mjs'
      - '.github/workflows/deploy-main.yml'
      - '.github/workflows/responsive-ui.yml'

permissions:
  contents: read

concurrency:
  group: dashboard-ui-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-plg-infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - run: terraform fmt -check
        working-directory: infra/one-plg
      - run: terraform init -backend=false -input=false -lockfile=readonly
        working-directory: infra/one-plg
      - run: terraform validate -no-color
        working-directory: infra/one-plg
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:ui:one-platforms
      - run: npm run test:ui:agent-feature-render
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Save UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-ui-${{ github.event.pull_request.number }}
          path: |
            .codex/artifacts/ui/
            test-results/
          include-hidden-files: true
          retention-days: 7
