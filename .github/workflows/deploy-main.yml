name: Deploy metrics.hussh.ai

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: metrics-hushh-ai-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: hushh-ai-prod
  REGION: us-central1
  SERVICE: hushh-matrix-dashboard
  ARTIFACT_REGISTRY_REPOSITORY: website-images
  RUNTIME_SERVICE_ACCOUNT: metrics-dashboard-runtime@hushh-ai-prod.iam.gserviceaccount.com
  DEPLOY_SERVICE_ACCOUNT: github-actions-deployer@hushh-ai-prod.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/1072839345524/locations/global/workloadIdentityPools/github-actions/providers/github-hussh-matrix-dashboard
  PRODUCTION_URL: https://metrics.hussh.ai
  GOOGLE_CLIENT_ID: 1072839345524-h2puhcg3e5uj7g2j1752lr9s19pbbmg9.apps.googleusercontent.com
  GOOGLE_REDIRECT_URI: https://metrics.hussh.ai/auth/callback
  INSTAGRAM_ACCOUNT_ID: '17841436775785807'
  INSTAGRAM_CREDENTIAL_RESOURCE: projects/hushh-ai-prod/secrets/metrics-instagram-credential
  INSTAGRAM_ADMIN_EMAIL: i-neelesh@hushh.ai
  ONE_PLG_CONFIGURED: ${{ vars.ONE_PLG_CONFIGURED }}
  ONE_PLG_AUDIENCE_CONFIGURED: ${{ vars.ONE_PLG_AUDIENCE_CONFIGURED }}
  ONE_PLG_SENDER_CONFIGURED: ${{ vars.ONE_PLG_SENDER_CONFIGURED }}
  ONE_PLG_DELIVERY_CONFIGURED: ${{ vars.ONE_PLG_DELIVERY_CONFIGURED }}
  ONE_PLG_SUBSCRIPTIONS_CONFIGURED: ${{ vars.ONE_PLG_SUBSCRIPTIONS_CONFIGURED }}
  ONE_PLG_GOOGLE_MAIL_CONFIGURED: ${{ vars.ONE_PLG_GOOGLE_MAIL_CONFIGURED }}
  ONE_PLG_GOOGLE_FEEDBACK_CONFIGURED: ${{ vars.ONE_PLG_GOOGLE_FEEDBACK_CONFIGURED }}

jobs:
  deploy:
    name: Build, deploy, and verify production
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Verify authentication and browser session contracts
        run: npm test

      - name: Verify One Location routes
        run: npm run test:routes:one-location

      - name: Install browser for responsive UI checks
        run: npx playwright install --with-deps chromium

      - name: Verify dashboard pages and responsive interactions
        run: npm run test:ui

      - name: Save responsive UI screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-ui-verification
          path: |
            .codex/artifacts/ui/
            test-results/
          retention-days: 7
          include-hidden-files: true

      - name: Verify One platform cards across API schema versions
        run: npm run test:ui:one-platforms

      - name: Verify One agent event classification and feature labels
        run: |
          npm run test:metrics:agent-feature-classification
          npm run test:ui:agent-feature-render

      - name: Verify analyst product routing
        run: npm run test:agent:product-routing

      - name: Verify rollback traffic snapshot
        run: npm run test:deploy:traffic-snapshot

      - name: Build app
        run: npm run build

      - name: Check diff whitespace
        run: git diff --check

      - name: Secret pattern scan
        run: |
          if git grep -nE 'sbp_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9_-]{20,}|-----BEGIN [A-Z ]+PRIVATE KEY-----' -- . ':(exclude)package-lock.json' ':(exclude)dist/**'; then
            echo "Potential secret material found in tracked files."
            exit 1
          fi
          echo "No tracked secret patterns found."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: bq

      - name: Build container image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"
          BUILD_ID="$(gcloud builds submit \
            --project="${PROJECT_ID}" \
            --tag="${IMAGE}" \
            --async \
            --format='value(id)' \
            .)"
          echo "Cloud Build ID: ${BUILD_ID}"
          for attempt in $(seq 1 90); do
            STATUS="$(gcloud builds describe "${BUILD_ID}" --project="${PROJECT_ID}" --format='value(status)')"
            echo "Cloud Build status: ${STATUS}"
            case "${STATUS}" in
              SUCCESS)
                exit 0
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Cloud Build failed with status ${STATUS}"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Cloud Build did not finish within the expected window."
          exit 1

      - name: Capture current production traffic split
        run: |
          PREVIOUS_TRAFFIC="$(gcloud run services describe "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format=json | node scripts/capture-cloud-run-traffic.mjs)"
          echo "PREVIOUS_TRAFFIC=${PREVIOUS_TRAFFIC}" >> "${GITHUB_ENV}"

      - name: Deploy Cloud Run service
        id: deploy
        run: |
          # Emit disabled settings too: --update-env-vars preserves omitted keys.
          PLG_ENV_SUFFIX="|PLG_ENABLED=false|PLG_DELIVERY_ENABLED=false|PLG_ONE_SOURCE_URL="
          PLG_SECRET_SUFFIX=""
          PLG_DELIVERY_ENABLED=false
          GOOGLE_MAIL_ENV="|PLG_GOOGLE_MAIL_ENABLED=false|PLG_GOOGLE_MAIL_CAMPAIGNS_ENABLED=false|PLG_EMAIL_PROVIDER=resend|PLG_GOOGLE_MAIL_CREDENTIAL_SECRET="
          REMOVE_PROVIDER_SECRETS=()
          if [[ "${ONE_PLG_GOOGLE_FEEDBACK_CONFIGURED}" == "true" ]]; then
            [[ "${ONE_PLG_GOOGLE_MAIL_CONFIGURED}" == "true" && "${ONE_PLG_SUBSCRIPTIONS_CONFIGURED}" == "true" ]] || exit 1
          fi
          if [[ "${ONE_PLG_GOOGLE_MAIL_CONFIGURED}" == "true" ]]; then
            [[ "${ONE_PLG_CONFIGURED}" == "true" && "${ONE_PLG_SENDER_CONFIGURED}" == "true" ]] || exit 1
            if [[ "${ONE_PLG_DELIVERY_CONFIGURED}" == "true" && "${ONE_PLG_GOOGLE_FEEDBACK_CONFIGURED}" != "true" ]]; then
              echo "Google customer sending requires the feedback release."
              exit 1
            fi
            gcloud secrets describe metrics-one-plg-google-mail --project="${PROJECT_ID}" --format='value(name)' > /dev/null
            GOOGLE_CAMPAIGNS=false
            [[ "${ONE_PLG_GOOGLE_FEEDBACK_CONFIGURED}" != "true" ]] || GOOGLE_CAMPAIGNS=true
            GOOGLE_MAIL_ENV="|PLG_GOOGLE_MAIL_ENABLED=true|PLG_GOOGLE_MAIL_CAMPAIGNS_ENABLED=${GOOGLE_CAMPAIGNS}|PLG_EMAIL_PROVIDER=google_workspace|PLG_GOOGLE_MAIL_CREDENTIAL_SECRET=projects/${PROJECT_ID}/secrets/metrics-one-plg-google-mail"
            REMOVE_PROVIDER_SECRETS=(--remove-secrets=PLG_RESEND_API_KEY,PLG_RESEND_WEBHOOK_SECRET)
          fi
          if [[ "${ONE_PLG_DELIVERY_CONFIGURED}" == "true" ]]; then
            if [[ "${ONE_PLG_CONFIGURED}" != "true" || "${ONE_PLG_SENDER_CONFIGURED}" != "true" ]]; then
              echo "Live delivery requires the configured workspace and verified sender release."
              exit 1
            fi
            PLG_DELIVERY_ENABLED=true
          fi
          if [[ "${ONE_PLG_CONFIGURED}" == "true" ]]; then
            DATABASE_TYPE="$(gcloud firestore databases describe --database=one-plg-production --project="${PROJECT_ID}" --format='value(type)')"
            if [[ "${DATABASE_TYPE}" != "FIRESTORE_NATIVE" ]]; then
              echo "The named PLG database must be provisioned in Native mode."
              exit 1
            fi
            PLG_ENV_SUFFIX="|PLG_ENABLED=true|PLG_STORAGE=firestore|PLG_FIRESTORE_PROJECT=${PROJECT_ID}|PLG_FIRESTORE_DATABASE=one-plg-production|PLG_PUBLIC_ORIGIN=${PRODUCTION_URL}|PLG_ONE_SOURCE_URL=https://api.hushh.ai/api/one/plg/snapshot|PLG_DELIVERY_ENABLED=${PLG_DELIVERY_ENABLED}"
            PLG_SECRET_SUFFIX=",PLG_SIGNING_SECRET=metrics-one-plg-signing-secret:latest,PLG_SYNC_SECRET=metrics-one-plg-sync-secret:latest,PLG_CYCLE_SECRET=metrics-one-plg-cycle-secret:latest,PLG_ONE_SOURCE_SECRET=metrics-one-plg-source-secret:latest,PLG_ADMIN_EMAILS=metrics-one-plg-admin-emails:latest,PLG_OPERATOR_EMAILS=metrics-one-plg-operator-emails:latest"
          fi
          if [[ "${ONE_PLG_SENDER_CONFIGURED}" == "true" ]]; then
            if [[ "${ONE_PLG_CONFIGURED}" != "true" ]]; then
              echo "Sender identity requires the configured workspace."
              exit 1
            fi
            for secret in metrics-one-plg-email-from metrics-one-plg-reply-to; do
              [[ "$(gcloud secrets versions describe latest --secret="$secret" --project="${PROJECT_ID}" --format='value(state)')" == "ENABLED" ]] || exit 1
            done
            PLG_SECRET_SUFFIX+=",PLG_EMAIL_FROM=metrics-one-plg-email-from:latest,PLG_REPLY_TO=metrics-one-plg-reply-to:latest"
          fi
          if [[ "${ONE_PLG_DELIVERY_CONFIGURED}" == "true" && "${ONE_PLG_GOOGLE_MAIL_CONFIGURED}" != "true" ]]; then
            for secret in metrics-one-plg-resend-api-key metrics-one-plg-resend-webhook-secret; do
              [[ "$(gcloud secrets versions describe latest --secret="$secret" --project="${PROJECT_ID}" --format='value(state)')" == "ENABLED" ]] || exit 1
            done
            PLG_SECRET_SUFFIX+=",PLG_RESEND_API_KEY=metrics-one-plg-resend-api-key:latest,PLG_RESEND_WEBHOOK_SECRET=metrics-one-plg-resend-webhook-secret:latest"
          fi
          if [[ "${ONE_PLG_AUDIENCE_CONFIGURED}" == "true" ]]; then
            if [[ "${ONE_PLG_CONFIGURED}" != "true" ]]; then
              echo "The private audience reader requires the configured PLG workspace."
              exit 1
            fi
            if [[ "$(gcloud secrets versions describe latest --secret=metrics-one-plg-audience-secret --project="${PROJECT_ID}" --format='value(state)')" != "ENABLED" ]]; then
              echo "The private audience credential needs an enabled version."
              exit 1
            fi
            PLG_ENV_SUFFIX+="|PLG_ONE_AUDIENCE_URL=https://api.hushh.ai/api/one/plg/audience"
            PLG_SECRET_SUFFIX+=",PLG_ONE_AUDIENCE_SECRET=metrics-one-plg-audience-secret:latest"
          else
            # Clear the endpoint on rollback, even if a prior key mount remains.
            PLG_ENV_SUFFIX+="|PLG_ONE_AUDIENCE_URL="
          fi
          if [[ "${ONE_PLG_SUBSCRIPTIONS_CONFIGURED}" == "true" ]]; then
            [[ "${ONE_PLG_CONFIGURED}" == "true" ]] || exit 1
            [[ "$(gcloud secrets versions describe latest --secret=metrics-one-plg-subscription-secret --project="${PROJECT_ID}" --format='value(state)')" == "ENABLED" ]] || exit 1
            PLG_ENV_SUFFIX+="|PLG_ONE_SUBSCRIPTION_ENABLED=true|PLG_ONE_SUBSCRIPTION_URL=https://api.hushh.ai/api/one/plg/subscriptions"
            PLG_SECRET_SUFFIX+=",PLG_ONE_SUBSCRIPTION_SECRET=metrics-one-plg-subscription-secret:latest"
          else
            PLG_ENV_SUFFIX+="|PLG_ONE_SUBSCRIPTION_ENABLED=false|PLG_ONE_SUBSCRIPTION_URL="
          fi
          PLG_ENV_SUFFIX+="${GOOGLE_MAIL_ENV}"
          gcloud run deploy "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE}" \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --update-env-vars="^|^GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}|GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}|ALLOWED_EMAIL_DOMAINS=hussh.ai,hushh.ai,hushhtech.com,hushh.labs,hush1one.com|REQUIRE_AUTH=true|INSTAGRAM_ANALYTICS_ENABLED=true|INSTAGRAM_USER_ID=${INSTAGRAM_ACCOUNT_ID}|INSTAGRAM_CREDENTIAL_SECRET=${INSTAGRAM_CREDENTIAL_RESOURCE}|INSTAGRAM_ANALYTICS_ADMIN_EMAILS=${INSTAGRAM_ADMIN_EMAIL}${PLG_ENV_SUFFIX}" \
            --update-secrets="GOOGLE_CLIENT_SECRET=metrics-dashboard-google-client-secret:latest,SESSION_SECRET=metrics-dashboard-session-secret:latest,ALLOWED_EMAILS=metrics-dashboard-allowed-emails:latest${PLG_SECRET_SUFFIX}" \
            "${REMOVE_PROVIDER_SECRETS[@]}" \
            --allow-unauthenticated \
            --port=8080 \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --no-traffic \
            --tag=release-candidate

          CANDIDATE_REVISION="$(gcloud run services describe "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(status.latestCreatedRevisionName)')"
          if [[ -z "${CANDIDATE_REVISION}" ]]; then
            echo "Cloud Run did not report the newly created revision."
            exit 1
          fi
          echo "CANDIDATE_REVISION=${CANDIDATE_REVISION}" >> "${GITHUB_ENV}"

          CANDIDATE_URL="$(gcloud run services describe "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format=json | node -e '
              let input = "";
              process.stdin.on("data", (chunk) => { input += chunk; });
              process.stdin.on("end", () => {
                const service = JSON.parse(input);
                const candidate = (service.status?.traffic ?? [])
                  .find((entry) => entry.tag === "release-candidate");
                if (candidate?.url) process.stdout.write(candidate.url);
              });
            ')"
          if [[ -z "${CANDIDATE_URL}" ]]; then
            echo "The tagged, zero-traffic candidate URL is unavailable."
            exit 1
          fi
          echo "CANDIDATE_URL=${CANDIDATE_URL}" >> "${GITHUB_ENV}"

      - name: Verify runtime secret bindings
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const service = JSON.parse(execFileSync('gcloud', [
            'run', 'services', 'describe', process.env.SERVICE,
            `--project=${process.env.PROJECT_ID}`,
            `--region=${process.env.REGION}`,
            '--format=json',
          ], { encoding: 'utf8' }));
          const env = service.spec?.template?.spec?.containers?.[0]?.env || [];
          const allowedPlain = new Set([
            'PORT',
            'METRICS_CHAT_RATE_LIMIT_HOURLY',
            'METRICS_CHAT_RATE_LIMIT_DAILY',
            'GEMINI_METRICS_CHAT_MODEL',
            'METRICS_CHAT_REQUEST_TIMEOUT_MS',
            'METRICS_CHAT_CONTEXT_CACHE_SECONDS',
            'GOOGLE_CLIENT_ID',
            'GOOGLE_REDIRECT_URI',
            'ALLOWED_EMAIL_DOMAINS',
            'REQUIRE_AUTH',
            'ALLOW_PUBLIC_DASHBOARD',
            // These are identifiers/feature settings, never credential values.
            'INSTAGRAM_ANALYTICS_ENABLED',
            'INSTAGRAM_USER_ID',
            'INSTAGRAM_CREDENTIAL_SECRET',
            'INSTAGRAM_ANALYTICS_ADMIN_EMAILS',
            'PLG_ENABLED', 'PLG_STORAGE', 'PLG_FIRESTORE_PROJECT', 'PLG_FIRESTORE_DATABASE',
            'PLG_PUBLIC_ORIGIN', 'PLG_ONE_SOURCE_URL', 'PLG_ONE_AUDIENCE_URL', 'PLG_DELIVERY_ENABLED',
            'PLG_ONE_SUBSCRIPTION_ENABLED', 'PLG_ONE_SUBSCRIPTION_URL',
            'PLG_GOOGLE_MAIL_ENABLED', 'PLG_GOOGLE_MAIL_CREDENTIAL_SECRET',
            'PLG_GOOGLE_MAIL_CAMPAIGNS_ENABLED', 'PLG_EMAIL_PROVIDER',
          ]);
          const plain = env.filter((entry) => entry.value && !allowedPlain.has(entry.name)).map((entry) => entry.name);
          if (plain.length > 0) {
            console.error(`Runtime env vars are not Secret Manager-backed: ${plain.join(', ')}`);
            process.exit(1);
          }
          const byName = new Map(env.map((entry) => [entry.name, entry]));
          const requiredSecrets = {
            GOOGLE_CLIENT_SECRET: 'metrics-dashboard-google-client-secret',
            SESSION_SECRET: 'metrics-dashboard-session-secret',
            ALLOWED_EMAILS: 'metrics-dashboard-allowed-emails',
          };
          const googleMailEnabled = process.env.ONE_PLG_GOOGLE_MAIL_CONFIGURED === 'true';
          if (byName.get('PLG_GOOGLE_MAIL_ENABLED')?.value !== String(googleMailEnabled) ||
              (byName.get('PLG_GOOGLE_MAIL_CREDENTIAL_SECRET')?.value || '') !==
                (googleMailEnabled ? `projects/${process.env.PROJECT_ID}/secrets/metrics-one-plg-google-mail` : ''))
            throw new Error('Google mailbox release setting mismatch');
          const googleFeedback = process.env.ONE_PLG_GOOGLE_FEEDBACK_CONFIGURED === 'true';
          if (byName.get('PLG_GOOGLE_MAIL_CAMPAIGNS_ENABLED')?.value !== String(googleFeedback) ||
              byName.get('PLG_EMAIL_PROVIDER')?.value !== (googleMailEnabled ? 'google_workspace' : 'resend'))
            throw new Error('Google feedback release setting mismatch');
          if (googleFeedback && (!googleMailEnabled || process.env.ONE_PLG_SUBSCRIPTIONS_CONFIGURED !== 'true'))
            throw new Error('Google feedback requires the canonical permission integration');
          if (googleMailEnabled && (byName.has('PLG_RESEND_API_KEY') || byName.has('PLG_RESEND_WEBHOOK_SECRET')))
            throw new Error('Google mail must not mount third-party mail credentials');
          if (googleMailEnabled && process.env.ONE_PLG_DELIVERY_CONFIGURED === 'true' && !googleFeedback)
            throw new Error('Google customer sending requires its feedback release');
          if (process.env.ONE_PLG_CONFIGURED === 'true') {
            Object.assign(requiredSecrets, {
              PLG_SIGNING_SECRET: 'metrics-one-plg-signing-secret',
              PLG_SYNC_SECRET: 'metrics-one-plg-sync-secret',
              PLG_CYCLE_SECRET: 'metrics-one-plg-cycle-secret',
              PLG_ONE_SOURCE_SECRET: 'metrics-one-plg-source-secret',
              PLG_ADMIN_EMAILS: 'metrics-one-plg-admin-emails',
              PLG_OPERATOR_EMAILS: 'metrics-one-plg-operator-emails',
            });
            const expected = {
              PLG_ENABLED: 'true', PLG_STORAGE: 'firestore', PLG_FIRESTORE_PROJECT: process.env.PROJECT_ID,
              PLG_FIRESTORE_DATABASE: 'one-plg-production', PLG_PUBLIC_ORIGIN: process.env.PRODUCTION_URL,
              PLG_ONE_SOURCE_URL: 'https://api.hushh.ai/api/one/plg/snapshot', PLG_DELIVERY_ENABLED: process.env.ONE_PLG_DELIVERY_CONFIGURED === 'true' ? 'true' : 'false',
            };
            for (const [name, value] of Object.entries(expected)) {
              if (byName.get(name)?.value !== value) throw new Error(`PLG release setting mismatch: ${name}`);
            }
          } else {
            if (byName.get('PLG_ENABLED')?.value !== 'false' || byName.get('PLG_DELIVERY_ENABLED')?.value !== 'false' || byName.get('PLG_ONE_SOURCE_URL')?.value) throw new Error('Disabled PLG must clear workspace, delivery and source settings');
          }
          if (process.env.ONE_PLG_SENDER_CONFIGURED === 'true') {
            if (process.env.ONE_PLG_CONFIGURED !== 'true') throw new Error('Sender requires PLG workspace');
            Object.assign(requiredSecrets, { PLG_EMAIL_FROM: 'metrics-one-plg-email-from', PLG_REPLY_TO: 'metrics-one-plg-reply-to' });
          }
          if (process.env.ONE_PLG_DELIVERY_CONFIGURED === 'true') {
            if (process.env.ONE_PLG_SENDER_CONFIGURED !== 'true') throw new Error('Delivery requires sender configuration');
            if (!googleMailEnabled) Object.assign(requiredSecrets, { PLG_RESEND_API_KEY: 'metrics-one-plg-resend-api-key', PLG_RESEND_WEBHOOK_SECRET: 'metrics-one-plg-resend-webhook-secret' });
          }
          if (process.env.ONE_PLG_AUDIENCE_CONFIGURED === 'true') {
            if (process.env.ONE_PLG_CONFIGURED !== 'true' || byName.get('PLG_ONE_AUDIENCE_URL')?.value !== 'https://api.hushh.ai/api/one/plg/audience') throw new Error('Private audience release setting mismatch');
            Object.assign(requiredSecrets, { PLG_ONE_AUDIENCE_SECRET: 'metrics-one-plg-audience-secret' });
          } else if (byName.get('PLG_ONE_AUDIENCE_URL')?.value) {
            throw new Error('Private audience endpoint must be disabled');
          }
          if (process.env.ONE_PLG_SUBSCRIPTIONS_CONFIGURED === 'true') {
            if (process.env.ONE_PLG_CONFIGURED !== 'true' || byName.get('PLG_ONE_SUBSCRIPTION_ENABLED')?.value !== 'true' || byName.get('PLG_ONE_SUBSCRIPTION_URL')?.value !== 'https://api.hushh.ai/api/one/plg/subscriptions') throw new Error('Subscription release setting mismatch');
            Object.assign(requiredSecrets, { PLG_ONE_SUBSCRIPTION_SECRET: 'metrics-one-plg-subscription-secret' });
          } else if (byName.get('PLG_ONE_SUBSCRIPTION_ENABLED')?.value !== 'false' || byName.get('PLG_ONE_SUBSCRIPTION_URL')?.value) {
            throw new Error('Subscription integration must be disabled');
          }
          for (const [name, secretName] of Object.entries(requiredSecrets)) {
            if (byName.get(name)?.valueFrom?.secretKeyRef?.name !== secretName) {
              console.error(`${name} is not bound to the expected Secret Manager secret.`);
              process.exit(1);
            }
          }
          if (byName.get('REQUIRE_AUTH')?.value !== 'true' ||
              byName.get('GOOGLE_CLIENT_ID')?.value !== process.env.GOOGLE_CLIENT_ID ||
              byName.get('GOOGLE_REDIRECT_URI')?.value !== process.env.GOOGLE_REDIRECT_URI) {
            console.error('Production Google sign-in settings do not match the release configuration.');
            process.exit(1);
          }
          if (byName.get('INSTAGRAM_ANALYTICS_ENABLED')?.value !== 'true' ||
              byName.get('INSTAGRAM_USER_ID')?.value !== process.env.INSTAGRAM_ACCOUNT_ID ||
              byName.get('INSTAGRAM_CREDENTIAL_SECRET')?.value !== process.env.INSTAGRAM_CREDENTIAL_RESOURCE ||
              byName.get('INSTAGRAM_ANALYTICS_ADMIN_EMAILS')?.value !== process.env.INSTAGRAM_ADMIN_EMAIL ||
              byName.has('INSTAGRAM_ACCESS_TOKEN')) {
            console.error('Production Instagram settings do not match the read-only release configuration.');
            process.exit(1);
          }
          console.log(`Latest ready revision: ${service.status?.latestReadyRevisionName || 'unknown'}`);
          NODE

      # Anonymous API probes must no longer expect public 200 responses after
      # Google sign-in is enforced. Check the access boundary, then independently
      # audit the source export without bypassing the live sign-in requirement.
      - name: Verify production Google sign-in boundary
        env:
          METRICS_DASHBOARD_URL: ${{ env.CANDIDATE_URL }}
        run: npm run test:prod:auth

      # Build/deploy and verification can outlive the GitHub OIDC assertion.
      # Renew the same identity at each phase; never extend credential lifetime.
      - name: Refresh cloud authentication for core API checks
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Verify authenticated product APIs
        run: bash scripts/run-release-api-phase.sh core

      - name: Refresh cloud authentication for customer KPI checks
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Verify customer KPI reconciliations
        run: bash scripts/run-release-api-phase.sh customers

      - name: Refresh cloud authentication for aggregate contracts
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Verify aggregate and historical contracts
        run: bash scripts/run-release-api-phase.sh contracts

      - name: Refresh cloud authentication for source audit
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Reconcile One source data without dashboard access
        env:
          BQ_JOB_PROJECT: ${{ env.PROJECT_ID }}
        run: node scripts/check-one-metrics-reconciliation.mjs --skip-dashboard

      - name: Confirm live traffic was not changed
        run: |
          CURRENT_TRAFFIC="$(gcloud run services describe "${SERVICE}" \
            --project="${PROJECT_ID}" --region="${REGION}" \
            --format=json | node scripts/capture-cloud-run-traffic.mjs)"
          if [[ "${CURRENT_TRAFFIC}" != "${PREVIOUS_TRAFFIC}" ]]; then
            echo "Traffic changed during zero-traffic candidate verification."
            exit 1
          fi
          echo "Candidate ${CANDIDATE_REVISION} passed automated gates at 0% traffic."
          echo "Interactive Google sign-in must be verified before manual promotion."

      - name: Preserve operator traffic after failed candidate verification
        # --no-traffic gives this job no ownership of the live allocation.
        # Even candidate traffic may be an operator's intentional canary.
        if: ${{ failure() && env.PREVIOUS_TRAFFIC != '' }}
        run: |
          CURRENT_TRAFFIC="$(gcloud run services describe "${SERVICE}" \
            --project="${PROJECT_ID}" --region="${REGION}" \
            --format=json | node scripts/capture-cloud-run-traffic.mjs)"
          echo "Candidate verification failed. Preserving operator traffic: ${CURRENT_TRAFFIC}"
          echo "No production traffic is changed by this zero-traffic workflow."
