name: Deploy metrics.hushh.ai

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: metrics-hushh-ai-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: hushh-ai-prod
  REGION: us-central1
  SERVICE: hushh-matrix-dashboard
  ARTIFACT_REGISTRY_REPOSITORY: website-images
  RUNTIME_SERVICE_ACCOUNT: metrics-dashboard-runtime@hushh-ai-prod.iam.gserviceaccount.com
  DEPLOY_SERVICE_ACCOUNT: github-actions-deployer@hushh-ai-prod.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/1072839345524/locations/global/workloadIdentityPools/github-actions/providers/github-hussh-matrix-dashboard
  PRODUCTION_URL: https://metrics.hushh.ai

jobs:
  deploy:
    name: Build, deploy, and verify production
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Verify authentication and browser session contracts
        run: npm test

      - name: Verify One Location routes
        run: npm run test:routes:one-location

      - name: Verify One platform cards across API schema versions
        run: npm run test:ui:one-platforms

      - name: Verify analyst product routing
        run: npm run test:agent:product-routing

      - name: Verify rollback traffic snapshot
        run: npm run test:deploy:traffic-snapshot

      - name: Build app
        run: npm run build

      - name: Check diff whitespace
        run: git diff --check

      - name: Secret pattern scan
        run: |
          if git grep -nE 'sbp_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9_-]{20,}|-----BEGIN [A-Z ]+PRIVATE KEY-----' -- . ':(exclude)package-lock.json' ':(exclude)dist/**'; then
            echo "Potential secret material found in tracked files."
            exit 1
          fi
          echo "No tracked secret patterns found."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build container image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"
          BUILD_ID="$(gcloud builds submit \
            --project="${PROJECT_ID}" \
            --tag="${IMAGE}" \
            --async \
            --format='value(id)' \
            .)"
          echo "Cloud Build ID: ${BUILD_ID}"
          for attempt in $(seq 1 90); do
            STATUS="$(gcloud builds describe "${BUILD_ID}" --project="${PROJECT_ID}" --format='value(status)')"
            echo "Cloud Build status: ${STATUS}"
            case "${STATUS}" in
              SUCCESS)
                exit 0
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Cloud Build failed with status ${STATUS}"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Cloud Build did not finish within the expected window."
          exit 1

      - name: Capture current production traffic split
        run: |
          PREVIOUS_TRAFFIC="$(gcloud run services describe "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format=json | node scripts/capture-cloud-run-traffic.mjs)"
          echo "PREVIOUS_TRAFFIC=${PREVIOUS_TRAFFIC}" >> "${GITHUB_ENV}"

      - name: Deploy Cloud Run service
        id: deploy
        run: |
          gcloud run deploy "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE}" \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --allow-unauthenticated \
            --port=8080 \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3

          CANDIDATE_REVISION="$(gcloud run services describe "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(status.latestCreatedRevisionName)')"
          if [[ -z "${CANDIDATE_REVISION}" ]]; then
            echo "Cloud Run did not report the newly created revision."
            exit 1
          fi
          echo "CANDIDATE_REVISION=${CANDIDATE_REVISION}" >> "${GITHUB_ENV}"

          # A rollback pins Cloud Run traffic to a named revision. Subsequent
          # deploys then create healthy revisions at 0% unless traffic is moved
          # explicitly. Route to the exact revision we just created so every
          # production probe below exercises the candidate, never stale code.
          gcloud run services update-traffic "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --to-revisions="${CANDIDATE_REVISION}=100"

          LIVE_REVISION="$(gcloud run services describe "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format=json | node -e '
              let input = "";
              process.stdin.on("data", (chunk) => { input += chunk; });
              process.stdin.on("end", () => {
                const service = JSON.parse(input);
                const live = (service.status?.traffic ?? [])
                  .find((entry) => Number(entry.percent) === 100);
                if (live?.revisionName) process.stdout.write(live.revisionName);
              });
            ')"
          if [[ "${LIVE_REVISION}" != "${CANDIDATE_REVISION}" ]]; then
            echo "Expected ${CANDIDATE_REVISION} at 100% traffic, found ${LIVE_REVISION:-none}."
            exit 1
          fi

      - name: Verify runtime secret bindings
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const service = JSON.parse(execFileSync('gcloud', [
            'run', 'services', 'describe', process.env.SERVICE,
            `--project=${process.env.PROJECT_ID}`,
            `--region=${process.env.REGION}`,
            '--format=json',
          ], { encoding: 'utf8' }));
          const env = service.spec?.template?.spec?.containers?.[0]?.env || [];
          const allowedPlain = new Set([
            'PORT',
            'METRICS_CHAT_RATE_LIMIT_HOURLY',
            'METRICS_CHAT_RATE_LIMIT_DAILY',
            'GEMINI_METRICS_CHAT_MODEL',
            'METRICS_CHAT_REQUEST_TIMEOUT_MS',
            'METRICS_CHAT_CONTEXT_CACHE_SECONDS',
            'GOOGLE_CLIENT_ID',
            'GOOGLE_REDIRECT_URI',
            'ALLOWED_EMAIL_DOMAINS',
            'REQUIRE_AUTH',
            'ALLOW_PUBLIC_DASHBOARD',
          ]);
          const plain = env.filter((entry) => entry.value && !allowedPlain.has(entry.name)).map((entry) => entry.name);
          if (plain.length > 0) {
            console.error(`Runtime env vars are not Secret Manager-backed: ${plain.join(', ')}`);
            process.exit(1);
          }
          console.log(`Latest ready revision: ${service.status?.latestReadyRevisionName || 'unknown'}`);
          NODE

      - name: Verify production metrics flow
        env:
          METRICS_DASHBOARD_URL: ${{ env.PRODUCTION_URL }}
          METRICS_FLOW_TIMEOUT_MS: "120000"
        run: npm run test:prod:metrics-flow -- --dashboard-url "${PRODUCTION_URL}" --timeout-ms 120000

      - name: Verify Hushh AI production
        env:
          HUSHH_AI_PRODUCTION_URL: ${{ env.PRODUCTION_URL }}
        run: npm run test:prod:hushh-ai -- --base-url "${PRODUCTION_URL}" --timeout-ms 120000

      - name: Verify One production
        env:
          METRICS_DASHBOARD_URL: ${{ env.PRODUCTION_URL }}
        run: npm run test:prod:one -- --dashboard-url "${PRODUCTION_URL}" --timeout-ms 120000

      - name: Verify One Location production and UAT analytics
        run: npm run test:api:one-location -- --base-url "${PRODUCTION_URL}" --days 7

      - name: Reconcile One unique-device and account metrics
        env:
          METRICS_DASHBOARD_URL: ${{ env.PRODUCTION_URL }}
          BQ_JOB_PROJECT: ${{ env.PROJECT_ID }}
        run: npm run test:metrics:one-reconciliation -- --dashboard-url "${PRODUCTION_URL}"

      - name: Reconcile One iOS identified accounts
        env:
          METRICS_DASHBOARD_URL: ${{ env.PRODUCTION_URL }}
          BQ_JOB_PROJECT: ${{ env.PROJECT_ID }}
        run: npm run test:metrics:ios-accounts

      - name: Reconcile One iOS installation and screen KPIs
        env:
          METRICS_DASHBOARD_URL: ${{ env.PRODUCTION_URL }}
          BQ_JOB_PROJECT: ${{ env.PROJECT_ID }}
        run: npm run test:metrics:ios-usage

      - name: Reconcile One web, iOS and Android activity KPIs
        env:
          METRICS_DASHBOARD_URL: ${{ env.PRODUCTION_URL }}
          BQ_JOB_PROJECT: ${{ env.PROJECT_ID }}
        # The deploy identity can read the production export but not the UAT
        # project's INFORMATION_SCHEMA. UAT remains a separate operator audit
        # until a deliberately scoped cross-project grant is approved.
        run: npm run test:metrics:one-platforms

      - name: Reconcile One registered accounts with Firebase Authentication
        env:
          METRICS_DASHBOARD_URL: ${{ env.PRODUCTION_URL }}
        run: npm run test:metrics:one-registered-accounts -- --dashboard-url "${PRODUCTION_URL}" --days 30

      - name: Verify dashboard KPI invariants
        run: npm run test:metrics:kpi-invariants -- --base-url "${PRODUCTION_URL}" --timeout-ms 120000

      - name: Verify aggregate-only public analytics contract
        run: npm run test:api:public-contract -- --base-url "${PRODUCTION_URL}" --days 7 --timeout-ms 120000

      - name: Roll back traffic after failed production verification
        # Deploy itself may change traffic before failing. Restoring the exact
        # prior allocation is safe even if no traffic change was reached.
        if: ${{ failure() && env.PREVIOUS_TRAFFIC != '' }}
        run: |
          gcloud run services update-traffic "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --to-revisions="${PREVIOUS_TRAFFIC}"
