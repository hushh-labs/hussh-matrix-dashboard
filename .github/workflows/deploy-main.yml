name: Deploy metrics.hushh.ai

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: metrics-hushh-ai-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: hushh-ai-prod
  REGION: us-central1
  SERVICE: hushh-matrix-dashboard
  ARTIFACT_REGISTRY_REPOSITORY: website-images
  RUNTIME_SERVICE_ACCOUNT: metrics-dashboard-runtime@hushh-ai-prod.iam.gserviceaccount.com
  DEPLOY_SERVICE_ACCOUNT: github-actions-deployer@hushh-ai-prod.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/1072839345524/locations/global/workloadIdentityPools/github-actions/providers/github-hussh-matrix-dashboard
  PRODUCTION_URL: https://metrics.hushh.ai
  GOOGLE_CLIENT_ID: 1072839345524-h2puhcg3e5uj7g2j1752lr9s19pbbmg9.apps.googleusercontent.com
  GOOGLE_REDIRECT_URI: https://metrics.hushh.ai/auth/callback
  INSTAGRAM_ACCOUNT_ID: '17841436775785807'
  INSTAGRAM_CREDENTIAL_RESOURCE: projects/hushh-ai-prod/secrets/metrics-instagram-credential
  INSTAGRAM_ADMIN_EMAIL: i-neelesh@hushh.ai

jobs:
  deploy:
    name: Build, deploy, and verify production
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Verify authentication and browser session contracts
        run: npm test

      - name: Verify One Location routes
        run: npm run test:routes:one-location

      - name: Verify One platform cards across API schema versions
        run: npm run test:ui:one-platforms

      - name: Verify One agent event classification and feature labels
        run: |
          npm run test:metrics:agent-feature-classification
          npm run test:ui:agent-feature-render

      - name: Verify analyst product routing
        run: npm run test:agent:product-routing

      - name: Verify rollback traffic snapshot
        run: npm run test:deploy:traffic-snapshot

      - name: Build app
        run: npm run build

      - name: Check diff whitespace
        run: git diff --check

      - name: Secret pattern scan
        run: |
          if git grep -nE 'sbp_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9_-]{20,}|-----BEGIN [A-Z ]+PRIVATE KEY-----' -- . ':(exclude)package-lock.json' ':(exclude)dist/**'; then
            echo "Potential secret material found in tracked files."
            exit 1
          fi
          echo "No tracked secret patterns found."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: bq

      - name: Build container image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"
          BUILD_ID="$(gcloud builds submit \
            --project="${PROJECT_ID}" \
            --tag="${IMAGE}" \
            --async \
            --format='value(id)' \
            .)"
          echo "Cloud Build ID: ${BUILD_ID}"
          for attempt in $(seq 1 90); do
            STATUS="$(gcloud builds describe "${BUILD_ID}" --project="${PROJECT_ID}" --format='value(status)')"
            echo "Cloud Build status: ${STATUS}"
            case "${STATUS}" in
              SUCCESS)
                exit 0
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Cloud Build failed with status ${STATUS}"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Cloud Build did not finish within the expected window."
          exit 1

      - name: Capture current production traffic split
        run: |
          PREVIOUS_TRAFFIC="$(gcloud run services describe "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format=json | node scripts/capture-cloud-run-traffic.mjs)"
          echo "PREVIOUS_TRAFFIC=${PREVIOUS_TRAFFIC}" >> "${GITHUB_ENV}"

      - name: Deploy Cloud Run service
        id: deploy
        run: |
          gcloud run deploy "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE}" \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --update-env-vars="^@^GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}@GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}@ALLOWED_EMAIL_DOMAINS=hushh.ai,hushhtech.com,hushh.labs,hush1one.com@REQUIRE_AUTH=true@INSTAGRAM_ANALYTICS_ENABLED=true@INSTAGRAM_USER_ID=${INSTAGRAM_ACCOUNT_ID}@INSTAGRAM_CREDENTIAL_SECRET=${INSTAGRAM_CREDENTIAL_RESOURCE}@INSTAGRAM_ANALYTICS_ADMIN_EMAILS=${INSTAGRAM_ADMIN_EMAIL}" \
            --update-secrets="GOOGLE_CLIENT_SECRET=metrics-dashboard-google-client-secret:latest,SESSION_SECRET=metrics-dashboard-session-secret:latest,ALLOWED_EMAILS=metrics-dashboard-allowed-emails:latest" \
            --allow-unauthenticated \
            --port=8080 \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --no-traffic \
            --tag=release-candidate

          CANDIDATE_REVISION="$(gcloud run services describe "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(status.latestCreatedRevisionName)')"
          if [[ -z "${CANDIDATE_REVISION}" ]]; then
            echo "Cloud Run did not report the newly created revision."
            exit 1
          fi
          echo "CANDIDATE_REVISION=${CANDIDATE_REVISION}" >> "${GITHUB_ENV}"

          CANDIDATE_URL="$(gcloud run services describe "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format=json | node -e '
              let input = "";
              process.stdin.on("data", (chunk) => { input += chunk; });
              process.stdin.on("end", () => {
                const service = JSON.parse(input);
                const candidate = (service.status?.traffic ?? [])
                  .find((entry) => entry.tag === "release-candidate");
                if (candidate?.url) process.stdout.write(candidate.url);
              });
            ')"
          if [[ -z "${CANDIDATE_URL}" ]]; then
            echo "The tagged, zero-traffic candidate URL is unavailable."
            exit 1
          fi
          echo "CANDIDATE_URL=${CANDIDATE_URL}" >> "${GITHUB_ENV}"

      - name: Verify runtime secret bindings
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const service = JSON.parse(execFileSync('gcloud', [
            'run', 'services', 'describe', process.env.SERVICE,
            `--project=${process.env.PROJECT_ID}`,
            `--region=${process.env.REGION}`,
            '--format=json',
          ], { encoding: 'utf8' }));
          const env = service.spec?.template?.spec?.containers?.[0]?.env || [];
          const allowedPlain = new Set([
            'PORT',
            'METRICS_CHAT_RATE_LIMIT_HOURLY',
            'METRICS_CHAT_RATE_LIMIT_DAILY',
            'GEMINI_METRICS_CHAT_MODEL',
            'METRICS_CHAT_REQUEST_TIMEOUT_MS',
            'METRICS_CHAT_CONTEXT_CACHE_SECONDS',
            'GOOGLE_CLIENT_ID',
            'GOOGLE_REDIRECT_URI',
            'ALLOWED_EMAIL_DOMAINS',
            'REQUIRE_AUTH',
            'ALLOW_PUBLIC_DASHBOARD',
            // These are identifiers/feature settings, never credential values.
            'INSTAGRAM_ANALYTICS_ENABLED',
            'INSTAGRAM_USER_ID',
            'INSTAGRAM_CREDENTIAL_SECRET',
            'INSTAGRAM_ANALYTICS_ADMIN_EMAILS',
          ]);
          const plain = env.filter((entry) => entry.value && !allowedPlain.has(entry.name)).map((entry) => entry.name);
          if (plain.length > 0) {
            console.error(`Runtime env vars are not Secret Manager-backed: ${plain.join(', ')}`);
            process.exit(1);
          }
          const byName = new Map(env.map((entry) => [entry.name, entry]));
          const requiredSecrets = {
            GOOGLE_CLIENT_SECRET: 'metrics-dashboard-google-client-secret',
            SESSION_SECRET: 'metrics-dashboard-session-secret',
            ALLOWED_EMAILS: 'metrics-dashboard-allowed-emails',
          };
          for (const [name, secretName] of Object.entries(requiredSecrets)) {
            if (byName.get(name)?.valueFrom?.secretKeyRef?.name !== secretName) {
              console.error(`${name} is not bound to the expected Secret Manager secret.`);
              process.exit(1);
            }
          }
          if (byName.get('REQUIRE_AUTH')?.value !== 'true' ||
              byName.get('GOOGLE_CLIENT_ID')?.value !== process.env.GOOGLE_CLIENT_ID ||
              byName.get('GOOGLE_REDIRECT_URI')?.value !== process.env.GOOGLE_REDIRECT_URI) {
            console.error('Production Google sign-in settings do not match the release configuration.');
            process.exit(1);
          }
          if (byName.get('INSTAGRAM_ANALYTICS_ENABLED')?.value !== 'true' ||
              byName.get('INSTAGRAM_USER_ID')?.value !== process.env.INSTAGRAM_ACCOUNT_ID ||
              byName.get('INSTAGRAM_CREDENTIAL_SECRET')?.value !== process.env.INSTAGRAM_CREDENTIAL_RESOURCE ||
              byName.get('INSTAGRAM_ANALYTICS_ADMIN_EMAILS')?.value !== process.env.INSTAGRAM_ADMIN_EMAIL ||
              byName.has('INSTAGRAM_ACCESS_TOKEN')) {
            console.error('Production Instagram settings do not match the read-only release configuration.');
            process.exit(1);
          }
          console.log(`Latest ready revision: ${service.status?.latestReadyRevisionName || 'unknown'}`);
          NODE

      # Anonymous API probes must no longer expect public 200 responses after
      # Google sign-in is enforced. Check the access boundary, then independently
      # audit the source export without bypassing the live sign-in requirement.
      - name: Verify production Google sign-in boundary
        env:
          METRICS_DASHBOARD_URL: ${{ env.CANDIDATE_URL }}
        run: npm run test:prod:auth

      - name: Verify authenticated product APIs and KPI reconciliations
        env:
          BQ_JOB_PROJECT: ${{ env.PROJECT_ID }}
          METRICS_DASHBOARD_URL: ${{ env.CANDIDATE_URL }}
          HUSHH_AI_PRODUCTION_URL: ${{ env.CANDIDATE_URL }}
        run: |
          # This synthetic, short-lived session checks protected APIs and KPI
          # correctness. It does NOT prove that Google's interactive callback
          # works; therefore this workflow never promotes production traffic.
          export SESSION_SECRET="$(gcloud secrets versions access latest --secret=metrics-dashboard-session-secret --project="${PROJECT_ID}")"
          export METRICS_AUTH_COOKIE="$(node scripts/create-release-session.mjs)"
          unset SESSION_SECRET
          export NODE_OPTIONS="--import=$(pwd)/scripts/release-auth-fetch.mjs"
          node scripts/check-metrics-flow.mjs --dashboard-url "${CANDIDATE_URL}" --timeout-ms 120000
          node scripts/check-hushh-ai-production.mjs --base-url "${CANDIDATE_URL}" --timeout-ms 120000
          node scripts/check-one-production.mjs --dashboard-url "${CANDIDATE_URL}" --timeout-ms 120000
          node scripts/check-one-location-analytics-contract.mjs --base-url "${CANDIDATE_URL}" --days 7
          node scripts/check-one-metrics-reconciliation.mjs --dashboard-url "${CANDIDATE_URL}"
          node scripts/check-one-ios-account-kpis.mjs --dashboard-url "${CANDIDATE_URL}"
          node scripts/check-one-ios-usage-kpis.mjs --dashboard-url "${CANDIDATE_URL}"
          node scripts/check-one-platform-kpis.mjs --dashboard-url "${CANDIDATE_URL}"
          node scripts/check-one-registered-accounts-reconciliation.mjs --dashboard-url "${CANDIDATE_URL}" --days 30
          node scripts/check-dashboard-kpi-invariants.mjs --base-url "${CANDIDATE_URL}" --timeout-ms 120000
          node scripts/check-public-analytics-contract.mjs --base-url "${CANDIDATE_URL}" --days 7 --timeout-ms 120000
          node scripts/check-founder-briefing-contract.mjs --base-url "${CANDIDATE_URL}" --timeout-ms 120000
          node scripts/check-founder-briefing-contract.mjs --base-url "${CANDIDATE_URL}" --timeout-ms 120000 --start-date 2026-08-01 --end-date 2026-08-31
          node scripts/check-founder-briefing-contract.mjs --base-url "${CANDIDATE_URL}" --timeout-ms 120000 --start-date 2026-06-24 --end-date 2026-09-21
          unset METRICS_AUTH_COOKIE NODE_OPTIONS

      - name: Reconcile One source data without dashboard access
        env:
          BQ_JOB_PROJECT: ${{ env.PROJECT_ID }}
        run: node scripts/check-one-metrics-reconciliation.mjs --skip-dashboard

      - name: Confirm live traffic was not changed
        run: |
          CURRENT_TRAFFIC="$(gcloud run services describe "${SERVICE}" \
            --project="${PROJECT_ID}" --region="${REGION}" \
            --format=json | node scripts/capture-cloud-run-traffic.mjs)"
          if [[ "${CURRENT_TRAFFIC}" != "${PREVIOUS_TRAFFIC}" ]]; then
            echo "Traffic changed during zero-traffic candidate verification."
            exit 1
          fi
          echo "Candidate ${CANDIDATE_REVISION} passed automated gates at 0% traffic."
          echo "Interactive Google sign-in must be verified before manual promotion."

      - name: Roll back traffic after failed production verification
        # Deploy itself may change traffic before failing. Restoring the exact
        # prior allocation is safe even if no traffic change was reached.
        if: ${{ failure() && env.PREVIOUS_TRAFFIC != '' }}
        run: |
          gcloud run services update-traffic "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --to-revisions="${PREVIOUS_TRAFFIC}"
